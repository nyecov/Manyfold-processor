[package]
name = "manyfold-processor"
version = "0.3.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
reqwest-middleware = "0.2"
reqwest-retry = "0.2"
serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"
notify = "6.1"
anyhow = "1.0"
axum = "0.6"
tower = "0.4"
tower-http = { version = "0.4", features = ["fs", "cors"] }
log = "0.4"
env_logger = "0.10"
walkdir = "2.5.0"
serde_yaml = "0.9.34"
sysinfo = "0.29"
regex = "1.10"
scraper = "0.25.0"
image = "0.25.9"
dashmap = "5.5"
once_cell = "1.18"
tracing = "0.1"
tracing-futures = "0.2"
ort = { version = "2.0.0-rc.11", optional = true }

[features]
default = ["full"]
full = ["ort"]
minimal-hal = []  # Exclude heavy AI dependencies for low-tier Satellites
mock-hardware = []  # Enable mock HAL implementations for Tier 1 simulation

[dev-dependencies]
cucumber = "0.20"
futures = "0.3"
glob = "0.3.3"
headless_chrome = "1.0.20"

[[test]]
name = "cucumber_runner"
harness = false



[workspace]

