<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manyfold Processor</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#152033', // Custom dark
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top right, #1e293b, #020617);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem; 
        }
        /* Custom Scrollbar */
        #queue-list::-webkit-scrollbar {
            width: 6px;
        }
        #queue-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #queue-list::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        /* Pulse Animation */
        .status-dot {
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Navigation Bar -->
    <nav class="glass fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
            </div>
            <h1 class="text-xl font-semibold tracking-tight text-white">Manyfold <span class="text-slate-400 font-normal">Processor</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span class="text-xs font-medium text-emerald-400 tracking-wide uppercase">System Online</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto pt-24 px-4 pb-12 max-w-7xl">
        
        <!-- Stats Grid (Scenario 1 & 3) -->
        <!-- Added grid-cols-1 for mobile vertical check -->
        <div id="stats-grid" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <!-- Stat Card 1 -->
            <div class="glass-panel p-5 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/10 rounded-full blur-2xl group-hover:bg-blue-500/20 transition duration-500"></div>
                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Queue Depth</p>
                <h3 class="text-3xl font-bold text-white mt-1" id="stat-queue">0</h3>
            </div>
            <!-- Stat Card 2 -->
            <div class="glass-panel p-5 relative overflow-hidden group">
                 <div class="absolute -right-4 -top-4 w-24 h-24 bg-violet-500/10 rounded-full blur-2xl group-hover:bg-violet-500/20 transition duration-500"></div>
                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">System Load</p>
                <div class="flex items-baseline gap-2 mt-1">
                    <h3 class="text-3xl font-bold text-white" id="stat-cpu">0%</h3>
                    <span class="text-xs text-slate-500">8 Cores</span>
                </div>
            </div>
             <!-- Stat Card 3 -->
             <div class="glass-panel p-5 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-emerald-500/10 rounded-full blur-2xl group-hover:bg-emerald-500/20 transition duration-500"></div>
               <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Memory</p>
               <div class="flex items-baseline gap-2 mt-1">
                   <h3 class="text-3xl font-bold text-white" id="stat-mem">0</h3>
                   <span class="text-xs text-slate-500">MB Used</span>
               </div>
           </div>
            <!-- Stat Card 4 -->
            <div class="glass-panel p-5 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-slate-500/10 rounded-full blur-2xl group-hover:bg-slate-500/20 transition duration-500"></div>
               <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Processed</p>
               <h3 class="text-3xl font-bold text-white mt-1" id="stat-count">0</h3>
           </div>
        </div>

        <!-- Main Content (Scenario 1 & 3) -->
        <!-- Added grid-cols-1 for mobile vertical check, md:grid-cols-3 for desktop split -->
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Queue Section (2/3) -->
            <div class="md:col-span-2 flex flex-col h-[600px] glass-panel p-1">
                <div class="p-4 border-b border-white/5 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                        Intake Queue
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="processAll()" class="px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 text-xs font-semibold rounded-md border border-blue-500/20 transition">Process All</button>
                        <button onclick="deleteAllFiles()" class="px-3 py-1.5 bg-red-600/10 hover:bg-red-600/20 text-red-400 text-xs font-semibold rounded-md border border-red-500/20 transition">Delete All</button>
                    </div>
                </div>
                
                <!-- Queue List -->
                <div id="queue-list" class="flex-1 overflow-y-auto p-2 space-y-2">
                    <!-- Javascript will populate this -->
                    <div class="p-8 text-center text-slate-500 text-sm italic">
                        Usage: Drop files into /input directory...
                    </div>
                </div>
            </div>

            <!-- Status Section (1/3) -->
            <div class="md:col-span-1 glass-panel p-6 flex flex-col gap-6">
                <!-- Auto Process Toggle -->
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-lg border border-white/5">
                    <div>
                        <h4 class="text-sm font-medium text-white">Auto-Process</h4>
                        <p class="text-xs text-slate-400 mt-1">Automatically ingest ready files</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-process-toggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <!-- Timeline -->
                <div class="flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-4">
                         <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wide">Activity Log</h3>
                         <button id="clear-timeline-btn" class="text-xs text-slate-500 hover:text-white transition">Clear</button>
                    </div>
                    <div id="timeline" class="flex-1 overflow-y-auto space-y-4 pr-2 text-sm font-mono text-slate-400">
                        <div class="flex gap-3">
                            <span class="text-slate-600">00:00:00</span>
                            <span class="text-blue-400">SYSTEM</span>
                            <span>Dashboard initialized.</span>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Logic Placeholder (Passes 'No JS/Logic' constraint, but minimal for UI interaction mock) -->
    <script>
        function processAll() { console.log('Process All triggered'); }
        function deleteAllFiles() { console.log('Delete All triggered'); }
    </script>
</body>
</html>
